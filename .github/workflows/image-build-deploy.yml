name: Image Build & Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  build-image:
    runs-on: ubuntu-latest
    outputs:
      image-id: ${{ steps.build.outputs.image-id }}
      image-name: ${{ steps.build.outputs.image-name }}
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Determine Version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            ENVIRONMENT="production"
          else
            VERSION="dev-${GITHUB_SHA::8}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            ENVIRONMENT="staging"
          fi
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
      
      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: 1.8
      
      - name: Build Golden Image
        id: build
        env:
          PKR_VAR_environment: ${{ steps.version.outputs.environment }}
          PKR_VAR_version: ${{ steps.version.outputs.version }}
          PKR_VAR_os_username: ${{ secrets.OS_USERNAME }}
          PKR_VAR_os_password: ${{ secrets.OS_PASSWORD }}
          PKR_VAR_os_auth_url: ${{ secrets.OS_AUTH_URL }}
        run: |
          cd image-build/packer
          packer init .
          packer build \
            -var-file=variables.pkrvars.hcl \
            -var="version=${{ steps.version.outputs.version }}" \
            ubuntu.pkr.hcl
          
          # Extract image ID from output
          IMAGE_ID=$(packer manifest.json | jq -r '.builds[0].artifact_id')
          echo "image-id=$IMAGE_ID" >> $GITHUB_OUTPUT
          echo "image-name=Golden-Image-Ubuntu-20.04-${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
      
      - name: Test Golden Image
        if: success()
        run: |
          # Run image validation tests
          python -m pytest tests/validation/ -v --tb=short -k "image_properties" || true

  deploy-staging:
    needs: build-image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.0
      
      - name: Deploy to Staging
        env:
          TF_VAR_environment: staging
          TF_VAR_image_id: ${{ needs.build-image.outputs.image-id }}
          TF_VAR_os_username: ${{ secrets.OS_USERNAME }}
          TF_VAR_os_password: ${{ secrets.OS_PASSWORD }}
          TF_VAR_os_auth_url: ${{ secrets.OS_AUTH_URL }}
        run: |
          cd infrastructure/terraform
          terraform init -upgrade
          terraform plan -var-file=../../vars/staging.tfvars -out=tfplan
          terraform apply tfplan
      
      - name: Run Staging Tests
        run: |
          python -m pytest tests/integration/ -v --tb=short -m "staging" || true
      
      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Staging Deployment: ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Staging Deployment*: ${{ job.status }}\nImage: ${{ needs.build-image.outputs.image-name }}"
                  }
                }
              ]
            }
        continue-on-error: true

  deploy-production:
    needs: [build-image, deploy-staging]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production  # Require manual approval
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.0
      
      - name: Deploy to Production
        env:
          TF_VAR_environment: production
          TF_VAR_image_id: ${{ needs.build-image.outputs.image-id }}
          TF_VAR_os_username: ${{ secrets.OS_USERNAME }}
          TF_VAR_os_password: ${{ secrets.OS_PASSWORD }}
          TF_VAR_os_auth_url: ${{ secrets.OS_AUTH_URL }}
        run: |
          cd infrastructure/terraform
          terraform init -upgrade
          terraform plan -var-file=../../vars/prod.tfvars -out=tfplan
          terraform apply tfplan
      
      - name: Post-Deployment Verification
        run: |
          # Run production acceptance tests
          python -m pytest tests/integration/ -v --tb=short -m "production" || true
      
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            Golden Image Release
            Image: ${{ needs.build-image.outputs.image-name }}
          draft: false
          prerelease: false
      
      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Production Deployment: ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment*: ${{ job.status }}\nImage: ${{ needs.build-image.outputs.image-name }}\nRelease: ${{ github.ref }}"
                  }
                }
              ]
            }
        continue-on-error: true
