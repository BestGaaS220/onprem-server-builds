---
# Security Role - Default Variables

# SSH Configuration
ssh_config:
  # Authentication
  PermitRootLogin: "no"
  PasswordAuthentication: "no"
  PubkeyAuthentication: "yes"
  PermitEmptyPasswords: "no"
  MaxAuthTries: "3"
  MaxSessions: "10"
  
  # Protocol and Ciphers
  Protocol: "2"
  Ciphers: "chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr"
  MACs: "hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256"
  KexAlgorithms: "curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512"
  
  # Security options
  X11Forwarding: "no"
  UseLogin: "no"
  PermitUserEnvironment: "no"
  ClientAliveInterval: "300"
  ClientAliveCountMax: "2"
  TCPKeepAlive: "yes"
  Compression: "delayed"
  
  # Logging and monitoring
  LogLevel: "VERBOSE"
  SyslogFacility: "AUTH"
  UseDNS: "no"

# UFW firewall configuration
ufw_enabled: true
ufw_rules:
  - rule: allow
    port: 22
    proto: tcp
    comment: "SSH"
  - rule: allow
    port: 443
    proto: tcp
    comment: "HTTPS"
  - rule: allow
    port: 80
    proto: tcp
    comment: "HTTP"
  - rule: allow
    port: 8080
    proto: tcp
    comment: "Application web port"
  - rule: reject
    port: 23
    proto: tcp
    comment: "Reject Telnet"

# Fail2ban configuration
fail2ban_enabled: true
fail2ban_jails:
  sshd:
    enabled: true
    port: ssh
    logpath: "%(sshd_log)s"
    maxretry: 3
    findtime: 600
    bantime: 3600
  
  recidive:
    enabled: true
    action: "%(action_mwl)s"
    logpath: "%(fail2ban_log)s"
    bantime: 604800
    findtime: 86400
    maxretry: 5

# Sudo configuration
sudo_groups: [sudo, wheel]
sudo_nopasswd: false

# File permissions
sensitive_files:
  - path: /etc/shadow
    owner: root
    group: shadow
    mode: "0640"
  - path: /etc/gshadow
    owner: root
    group: shadow
    mode: "0640"
  - path: /etc/passwd
    owner: root
    group: root
    mode: "0644"
  - path: /etc/group
    owner: root
    group: root
    mode: "0644"

# Audit configuration
auditd_enabled: true
audit_rules:
  - path: /etc/audit/rules.d/audit.rules
    rules:
      - "-b 8192"
      - "-f 1"
      - "-e 2"
      - "-a always,exit -F arch=b64 -S execve -F uid>=1000 -F auid>=1000 -k exec"
      - "-a always,exit -F arch=b64 -S open,openat -F exit=-EACCES -F auid>=1000 -k access"
      - "-a always,exit -F arch=b64 -S open,openat -F exit=-EPERM -F auid>=1000 -k access"

# Apparmor configuration
apparmor_enabled: false
apparmor_profiles: []

# SELinux (typically not used on Ubuntu but included for completeness)
selinux_enabled: false

# Sysctl hardening
sysctl_hardening:
  # Hide kernel pointers
  kernel.kptr_restrict: "2"
  # Hide kernel messages from unprivileged users
  kernel.printk: "3 3 3 3"
  # Restrict kernel module loading
  kernel.modules_disabled: "1"
  # Restrict access to kernel logs
  kernel.sysrq: "0"
  # Restrict ptrace scope
  kernel.yama.ptrace_scope: "2"
  # ASLR
  kernel.randomize_va_space: "2"
  # Coredumps
  kernel.core_uses_pid: "1"
  fs.suid_dumpable: "0"
  # Memory protection
  vm.mmap_min_addr: "65536"
  # IPv4 hardening
  net.ipv4.conf.all.send_redirects: "0"
  net.ipv4.conf.default.send_redirects: "0"
  net.ipv4.conf.all.accept_redirects: "0"
  net.ipv4.conf.default.accept_redirects: "0"
  net.ipv4.icmp_echo_ignore_broadcasts: "1"
  net.ipv4.conf.all.log_martians: "1"
  net.ipv4.tcp_timestamps: "0"
  net.ipv4.tcp_syncookies: "1"
  net.ipv4.tcp_rfc1337: "1"
  net.ipv4.conf.all.arp_ignore: "1"
  # IPv6 hardening
  net.ipv6.conf.all.disable_ipv6: "0"
  net.ipv6.conf.all.forwarding: "0"
  net.ipv6.conf.all.accept_redirects: "0"
  net.ipv6.conf.default.accept_redirects: "0"

# Update policies
unattended_upgrades_enabled: true
unattended_upgrades_mail: "root@localhost"
unattended_upgrades_auto_reboot: false
