# Ansible Inventory for Production Environment
# Populate with actual server IPs/hostnames from Terraform output
# CRITICAL: Ensure tight security controls and monitoring

[elevatediq_servers]
# prod-server-01 ansible_host=10.0.3.10 ansible_port=22
# prod-server-02 ansible_host=10.0.3.11 ansible_port=22
# prod-server-03 ansible_host=10.0.3.12 ansible_port=22

[web_servers]
# Add production web server hosts here

[database_servers]
# Add production database server hosts here

[monitoring_servers]
# Add production monitoring servers here

# Group variables
[elevatediq_servers:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/prod-key.pem
ansible_python_interpreter=/usr/bin/python3
ansible_port=22
ansible_pipelining=True

[all:vars]
# Environment Configuration
environment=production
project_name=elevatediq
region=RegionOne

# Connectivity
ansible_connection=ssh
ansible_ssh_extra_args="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts"
ansible_timeout=60

# Application Configuration
enable_monitoring=true
monitoring_interval=10
enable_backup=true
enable_ha=true
backup_retention_days=30

# System Configuration
ntp_server=ntp.ubuntu.com
dns_servers=["8.8.8.8", "8.8.4.4"]
syslog_server=syslog.prod.example.com

# Security (ENHANCED FOR PRODUCTION)
enable_firewall=true
enable_fail2ban=true
enable_apparmor=true
enable_audit=true
ssh_port=22
ssh_max_auth_tries=2
ssh_permit_root_login=no

# TLS/SSL
enable_tls=true
tls_cert_path=/etc/ssl/certs/
tls_key_path=/etc/ssl/private/

# Performance and Tuning
kernel_shmmax=137438953472
kernel_shmall=33554432
net_core_somaxconn=65535
net_ipv4_tcp_max_syn_backlog=65535

# Logging and Auditing
enable_centralized_logging=true
log_retention=90
enable_security_monitoring=true
