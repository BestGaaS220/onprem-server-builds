# Ansible Inventory for Production Environment
[web_servers]
# Add your production web servers here

[database_servers]
# Add your production database servers here

[all:vars]
# Connection settings
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/prod-key.pem
ansible_python_interpreter=/usr/bin/python3

# Application settings
environment=production
enable_monitoring=true
app_version=latest  # Should be set to specific version tag

# Ansible settings
ansible_ssh_extra_args="-o StrictHostKeyChecking=no"
