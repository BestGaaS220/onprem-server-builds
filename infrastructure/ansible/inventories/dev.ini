# Ansible Inventory for Development Environment
[web_servers]
# Add your development servers here

[database_servers]
# Add your development database servers here

[all:vars]
# Connection settings
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/dev-key.pem
ansible_python_interpreter=/usr/bin/python3

# Application settings
environment=dev
enable_monitoring=false
app_version=latest

# Ansible settings
ansible_ssh_extra_args="-o StrictHostKeyChecking=no"
