# Ansible Inventory for Staging Environment
# Populate with actual server IPs/hostnames from Terraform output

[elevatediq_servers]
# staging-server-01 ansible_host=10.0.2.10 ansible_port=22
# staging-server-02 ansible_host=10.0.2.11 ansible_port=22

[web_servers]
# Add web server hosts here

[database_servers]
# Add database server hosts here

[monitoring_servers]
# Add monitoring servers here

# Group variables
[elevatediq_servers:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/staging-key.pem
ansible_python_interpreter=/usr/bin/python3
ansible_port=22

[all:vars]
# Environment Configuration
environment=staging
project_name=elevatediq
region=RegionOne

# Connectivity
ansible_connection=ssh
ansible_ssh_extra_args="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
ansible_timeout=30

# Application Configuration
enable_monitoring=true
monitoring_interval=30
enable_backup=true
enable_ha=false
backup_retention_days=14

# System Configuration
ntp_server=ntp.ubuntu.com
dns_servers=["8.8.8.8", "8.8.4.4"]
syslog_server=

# Security
enable_firewall=true
enable_fail2ban=true
ssh_port=22
ssh_max_auth_tries=3

# Performance
kernel_shmmax=68719476736
kernel_shmall=16777216
