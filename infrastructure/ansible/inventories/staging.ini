# Ansible Inventory for Staging Environment
[web_servers]
# Add your staging web servers here

[database_servers]
# Add your staging database servers here

[all:vars]
# Connection settings
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/staging-key.pem
ansible_python_interpreter=/usr/bin/python3

# Application settings
environment=staging
enable_monitoring=true
app_version=latest

# Ansible settings
ansible_ssh_extra_args="-o StrictHostKeyChecking=no"
